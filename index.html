<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP Production | PT Murinda Sentra Baja</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bl:#0d47a1;--bd:#082f6e;--rd:#c62828;--or:#ff8a00;--bg:#f2f6fc;--tx:#14213d;--mu:#64748b;--ln:#e2e8f0}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx);background:var(--bg);height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.rp{position:relative;overflow:hidden;cursor:pointer}
.rip{position:absolute;border-radius:50%;background:rgba(13,71,161,.28);transform:scale(0);animation:rp .65s ease-out;pointer-events:none}
.g .rip,.x .rip,.p .rip,.y .rip,.lb .rip{background:rgba(255,255,255,.5)}
@keyframes rp{to{transform:scale(1);opacity:0}}@keyframes fi{from{opacity:0}}@keyframes pop{from{transform:scale(.86);opacity:0}}@keyframes sp{to{transform:rotate(360deg)}}
.cd{position:relative}.cd::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:.3s;background:radial-gradient(200px circle at var(--x,50%) var(--y,50%),rgba(255,138,0,.16),rgba(13,71,161,.08) 45%,transparent 70%)}.cd:hover::before{opacity:1}.cd>*{position:relative}
.b{border:1px solid var(--ln);background:#fff;padding:8px 14px;border-radius:12px;font-weight:600;transition:.2s;display:inline-flex;gap:6px;align-items:center}
.b:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(13,71,161,.2);border-color:#bcd0f0}.b:active{transform:scale(.95)}.b:disabled{opacity:.45;pointer-events:none}
.b.g{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:0}.b.x{background:linear-gradient(135deg,#107c41,#21a366);color:#fff;border:0}.b.p{background:linear-gradient(135deg,#c62828,#ef4444);color:#fff;border:0}.b.y{background:linear-gradient(135deg,#0d47a1,#2563eb);color:#fff;border:0}.b.r{background:#fff1f1;color:var(--rd);border-color:#fecaca}
/* logo */
.lw{position:relative;display:block;width:fit-content;margin:4px auto 14px;cursor:pointer;transition:.3s;filter:drop-shadow(0 4px 8px rgba(13,71,161,.15))}
.lw img{width:200px;display:block}
.lw::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) 150% 0/250% 100% no-repeat;-webkit-mask:var(--lg) center/contain no-repeat;mask:var(--lg) center/contain no-repeat;transition:background-position .8s}
.lw:hover{transform:scale(1.06);filter:drop-shadow(0 6px 16px rgba(255,138,0,.55))}.lw:hover::after{background-position:-50% 0}.lw:active{transform:scale(.94);filter:drop-shadow(0 0 22px rgba(198,40,40,.75))}
/* login */
#lg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:linear-gradient(120deg,#e3eeff,#fff3e2,#dff4ff,#e3eeff) 0 0/300% 300%;animation:bgm 14s ease infinite}
@keyframes bgm{50%{background-position:100% 100%}}
#lg::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(13,71,161,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(13,71,161,.07) 1px,transparent 1px);background-size:46px 46px;-webkit-mask:radial-gradient(circle,#000 30%,transparent 80%);mask:radial-gradient(circle,#000 30%,transparent 80%)}
.o{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 11s ease-in-out infinite alternate}.o1{width:420px;height:420px;background:#3b82f6;left:-80px;top:-60px}.o2{width:380px;height:380px;background:#ff8a00;right:-60px;bottom:-40px;animation-delay:-4s}.o3{width:300px;height:300px;background:#ef4444;left:45%;top:55%;opacity:.3;animation-delay:-7s}
@keyframes fl{to{transform:translate(70px,-50px) scale(1.2)}}
.gr{position:absolute;font-size:190px;font-weight:400;opacity:.1;animation:sp 40s linear infinite}
#sp s{display:block;position:absolute;bottom:-12px;border-radius:50%;background:var(--d);box-shadow:0 0 12px 3px var(--d);animation:up linear infinite}
@keyframes up{to{transform:translateY(-108vh) scale(.3);opacity:0}}
.lc{position:relative;width:min(410px,92vw);padding:30px 34px 34px;border-radius:26px;background:rgba(255,255,255,.74);backdrop-filter:blur(20px);border:1px solid #fff;box-shadow:0 30px 70px rgba(8,47,110,.22);display:grid;gap:14px;animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
.lc h2{text-align:center;font-size:26px;font-weight:800;color:var(--bd)}.lc p{text-align:center;color:var(--mu);margin-top:-8px}
.lc label{display:grid;gap:5px;font-weight:600;font-size:13px}
.lc select,.lc input{width:100%;height:48px;border:1.5px solid var(--ln);border-radius:14px;padding:0 14px;background:#fff;outline:0;transition:.2s}
.lc select:focus,.lc input:focus{border-color:var(--bl);box-shadow:0 0 0 4px rgba(13,71,161,.14)}.lc select:hover,.lc input:hover{border-color:#93b4ea}
.pw{position:relative}.ey{position:absolute;right:8px;top:8px;border:0;background:none;font-size:20px;cursor:pointer;transition:.2s}.ey:hover{transform:scale(1.25)}
.lb{height:50px;border:0;border-radius:14px;color:#fff;font-weight:800;font-size:15px;background:linear-gradient(135deg,#0d47a1,#2563eb 60%,#ff8a00);background-size:200%;transition:.3s}.lb:hover{background-position:100%;transform:translateY(-2px);box-shadow:0 12px 26px rgba(13,71,161,.4)}.lb:active{transform:scale(.97)}
.lb{display:flex;align-items:center;justify-content:center;gap:9px}.lb svg,.gb svg{width:20px;height:20px;transition:.3s}.lb:hover svg{transform:translateX(4px)}
.dv{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px}.dv::before,.dv::after{content:'';flex:1;height:1px;background:var(--ln)}
.gb{height:46px;border-radius:14px;border:1.5px solid #bcd0f0;background:rgba(255,255,255,.7);color:var(--bd);font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;transition:.3s}.gb:hover{background:#fff;border-color:var(--bl);transform:translateY(-2px);box-shadow:0 10px 22px rgba(13,71,161,.18)}.gb:hover svg{transform:scale(1.2);color:var(--or)}.gb:active{transform:scale(.97)}.gb small{font-weight:600;color:var(--mu)}
.ko{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 9px;border-radius:99px;background:linear-gradient(135deg,#e0ecff,#ffe9cc);color:var(--bd);font-size:10px;font-weight:700;vertical-align:middle}.ko svg{width:11px;height:11px;color:var(--or)}
.hn{margin-left:6px;padding:0 8px;border-radius:99px;background:#e8f0fd;color:var(--bl);font-size:10px;font-weight:700}
/* layout */
#app{display:none;height:100vh}
#sb{width:268px;background:#fff;border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:16px 12px;overflow:auto;flex:none;transition:.3s}
.gl{font-size:12px;font-weight:800;color:var(--mu);margin:14px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;font-weight:600;color:#334155;transition:.2s}
.nv i{font-style:normal;width:32px;height:32px;display:grid;place-items:center;border-radius:10px;font-size:17px;background:color-mix(in srgb,var(--c) 13%,#fff);transition:.25s}
.nv:hover{background:#f1f6ff;transform:translateX(4px)}.nv:hover i{animation:wg .6s;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
.nv.on{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,#fff),#fff);color:var(--bd);box-shadow:inset 3px 0 0 var(--c)}.nv.on i{transform:scale(1.12)}
@keyframes wg{25%{transform:rotate(-14deg) scale(1.2)}60%{transform:rotate(12deg) scale(1.2)}}
#ct{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
h1{font-size:20px;font-weight:800;flex:1;color:var(--bd)}#hb{display:none}
.us{display:flex;align-items:center;gap:10px}.us small{display:block;color:var(--mu);font-size:12px;line-height:1.1}.us b{display:block;line-height:1.2}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--bl),var(--or));transition:.3s}.av:hover{transform:rotate(360deg) scale(1.1)}
main{flex:1;overflow:auto;padding:20px 24px}
/* tabel */
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sr{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ln);border-radius:12px;padding:0 12px;min-width:260px;transition:.2s}.sr:focus-within{border-color:var(--bl);box-shadow:0 0 0 4px rgba(13,71,161,.12)}
.sr input{border:0;outline:0;padding:9px 0;flex:1;background:none}.cn{color:var(--mu);font-weight:600;flex:1}.bt{display:flex;gap:8px;flex-wrap:wrap}
.tw{background:#fff;border:1px solid var(--ln);border-radius:16px;overflow:auto;max-height:calc(100vh - 260px)}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#eaf1fd;color:var(--bd);text-align:left;padding:10px 14px;font-weight:700;white-space:nowrap;cursor:pointer;z-index:2;transition:.2s}th:hover{background:#d8e6fc}
td{padding:9px 14px;border-top:1px solid #eef2f8;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tbody tr{transition:.15s}tbody tr:hover{background:#f4f8ff;box-shadow:inset 3px 0 0 var(--or)}
.ac{display:flex;gap:4px}.i{border:0;background:#f1f5f9;border-radius:9px;width:32px;height:32px;transition:.2s}.i:hover{transform:scale(1.2) rotate(-6deg);background:#e0ebff}
.bd{padding:3px 10px;border-radius:99px;font-weight:700;font-size:12px}.bd.g{background:#dcfce7;color:#15803d}.bd.r{background:#fee2e2;color:#b91c1c}.bd.y{background:#fef3c7;color:#b45309}.bd.n{background:#e2e8f0;color:#475569}
.mt{color:#b6c0cf}.em{text-align:center;padding:40px;color:var(--mu)}.pg{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:14px;color:var(--mu);font-weight:600}
/* dashboard */
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:18px}
.kp{background:#fff;border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:18px;padding:18px;display:grid;transition:.25s}.kp:hover{transform:translateY(-4px);box-shadow:0 14px 30px color-mix(in srgb,var(--c) 25%,transparent)}
.kp i{font-style:normal;font-size:30px;transition:.3s}.kp:hover i{transform:scale(1.25) rotate(-8deg)}.kp b{font-size:30px;font-weight:800;color:var(--c)}.kp span{color:var(--mu);font-weight:600}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.pn{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:18px}.pn h4{margin-bottom:12px}.pn small{display:block;text-align:center;color:var(--mu);margin-top:10px}
.br{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin:8px 0}.br em{height:10px;background:#eef2f8;border-radius:9px;overflow:hidden}.br u{display:block;height:100%;width:var(--w);background:var(--c);border-radius:9px;animation:gw 1s}.br b{text-align:right}@keyframes gw{from{width:0}}
.dn{width:150px;height:150px;border-radius:50%;background:conic-gradient(#16a34a calc(var(--p)*1%),#fecaca 0);display:grid;place-items:center;margin:auto;position:relative}.dn::before{content:'';position:absolute;inset:18px;background:#fff;border-radius:50%}.dn b{position:relative;font-size:26px}
/* modal, loader, toast */
#mo{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(10,25,55,.4);backdrop-filter:blur(6px);padding:16px}#mo.on{display:grid;animation:fi .2s}
.mc{background:#fff;border-radius:22px;padding:24px;width:min(720px,100%);max-height:90vh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.3,.4,1);box-shadow:0 30px 70px rgba(8,47,110,.35)}.mc h3{font-size:18px;margin-bottom:14px;color:var(--bd)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:grid;gap:4px;font-weight:600;font-size:12px;color:var(--mu)}.fg label.w{grid-column:1/-1}
.fg input,.fg select,.fg textarea{border:1.5px solid var(--ln);border-radius:11px;padding:9px 12px;color:var(--tx);font-weight:500;outline:0;background:#fff;transition:.2s}.fg :focus{border-color:var(--bl);box-shadow:0 0 0 4px rgba(13,71,161,.12)}.fg :disabled{background:#f1f5f9;color:#64748b}
.fa{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#ld{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(242,246,252,.88);backdrop-filter:blur(10px)}#ld.on{display:flex;animation:fi .25s}
.orb{position:relative;width:112px;height:112px;display:grid;place-items:center;font-size:44px}
.orb::before,.orb::after{content:'';position:absolute;inset:0;border-radius:50%;border:4px solid transparent;border-top-color:var(--bl);border-right-color:var(--or);animation:sp 1.1s linear infinite;filter:drop-shadow(0 0 6px rgba(255,138,0,.5))}
.orb::after{inset:14px;border-top-color:var(--rd);border-right-color:#0891b2;animation-duration:1.7s;animation-direction:reverse}.orb i{font-style:normal;animation:sp 3s linear infinite}
.bm{width:250px;height:6px;border-radius:9px;background:#d5e0f3;position:relative}.bm b{position:absolute;left:0;top:-3px;height:12px;width:76px;border-radius:9px;background:linear-gradient(90deg,transparent,#ff8a00,#fff);box-shadow:0 0 20px 6px rgba(255,138,0,.7);animation:wd 1.1s ease-in-out infinite alternate}@keyframes wd{to{left:calc(100% - 76px)}}
#ldt{font-weight:700;color:var(--bd)}#ldt::after{content:'';animation:dt 1.2s steps(1) infinite}@keyframes dt{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#ts{position:fixed;right:20px;bottom:20px;z-index:80;display:grid;gap:8px}.to{background:#0f2a5c;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);border-left:5px solid #22c55e;animation:sl .35s}.to.e{border-color:#ef4444}@keyframes sl{from{transform:translateX(60px);opacity:0}}
#rpt{display:none}
@media(max-width:900px){#sb{position:fixed;left:-290px;top:0;bottom:0;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.2)}#sb.o{left:0}#hb{display:block}.us div{display:none}.fg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{@page{size:landscape;margin:10mm}body{height:auto;overflow:visible;background:#fff}body>*:not(#rpt){display:none!important}#rpt{display:block}#rpt .rh{display:flex;align-items:center;gap:20px;border-bottom:3px solid #0d47a1;padding-bottom:8px;margin-bottom:10px}#rpt img{width:170px}#rpt h2{color:#0d47a1}#rpt p{font-size:11px}#rpt table{font-size:8px}#rpt th{position:static;background:#0d47a1!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border:1px solid #999;padding:3px 5px;white-space:normal}#rpt td{border:1px solid #bbb;padding:3px 5px;white-space:normal;max-width:none}.sg{display:flex;gap:60px;margin-top:30px;page-break-inside:avoid}.sg div{width:200px;font-size:11px}.sg i{display:block;border-bottom:1px solid #000;height:60px}}
</style></head><body>
<div id="lg"><div class="o o1"></div><div class="o o2"></div><div class="o o3"></div><b class="gr" style="left:-40px;top:-30px">⚙️</b><b class="gr" style="right:-30px;bottom:-40px;font-size:250px;animation-direction:reverse">⚙️</b><div id="sp"></div>
<form class="lc" onsubmit="go();return false"><div class="lw"><img class="lg" alt="Murinda"></div><h2>ERP Production</h2><p>Masuk untuk mengelola produksi builtup dan komponen alat berat</p>
<label>Pengguna<select id="us"><option>Memuat pengguna…</option></select></label>
<label>Password<div class="pw"><input id="pw" type="password" placeholder="Masukkan password" autocomplete="current-password"><button type="button" class="ey" onclick="ev()">👁️</button></div></label>
<button class="lb rp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>Masuk</button><div class="dv">atau</div><button type="button" class="gb rp" onclick="gst()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Masuk sebagai Tamu <small>(hanya lihat)</small></button></form></div>
<div id="app"><aside id="sb"><div class="lw"><img class="lg" alt="Murinda"></div><nav id="nav"></nav></aside>
